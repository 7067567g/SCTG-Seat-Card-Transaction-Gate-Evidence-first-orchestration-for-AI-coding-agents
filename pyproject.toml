[project]
name = "sctg-reference"
version = "0.2.0"
description = "Evidence-first orchestration for AI coding agents: task cards, gates, independent decisions, and auditable ledgers."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = [
  "PyYAML>=6.0",
  "jsonschema>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
